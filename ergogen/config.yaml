meta:
  engine: 4.1.0
  name: SweepyWay
  version: &kb_version v0.2
  author: Happily-Coding
  url: &kb_url https://github.com/Happily-Coding/SweepyWay/

# Define presets that can be selected in the units section to achieve your desired layout.
presets:
  choc_spacing:
    # Standard Choc spacing, compatible with MBK keycaps which are 16.5 x 17.5
    kx: 17 # spacing between keys (X-axis) 
    ky: 18 # spacing between key (Y-axis)  # Will be overwritten by cfx spacing if you use cfx in units extends
    keycap_x_1u: 17.5
    keycap_y_1u: 16.5 # Will be overwritten by cfx spacing if you use cfx in units extends

    px: 5 #10 #3.5 #How much to pad horizontally
    py: 5 #10 #3.5 #how much to pad vertically
    plate_kx: 14.0 # key cutout hole width (choc v1: 13.8, choc v2: 13.95) - 14.0 = v1+v2 compatible
    plate_ky: 14.0 # key cutout hole height (choc v1: 13.8, choc v2: 13.95) - 14.0 = v1+v2 compatible
    vertical_diode_shift: 1.5 # How much to shift to avoid overlap
    horizontal_diode_shift: -0.5 plate_kx - 0.85
    diode_rotation: 0
    #diode_rotation: -180 # Diode rotation
    #switch_rotation: 180 # Hotswap south, led north
    
  cfx_spacing: # a preset that can be chosen in the units section, to create a pcb made for chosfox keycaps spacing, which is tighter vertically, allowing you to easily reach the number keys.
    # CFX 1u are 16.5x16.5 keys for a tighter 17x17 matrix.
    $extends: presets.choc_spacing
    kx: 17 # spacing between keys (X-axis) 
    ky: 17 # spacing between keys(Y-axis)
    keycap_x_1u: 16.5
  #pcb_to_case_wall_tolerance: 0.25 <-- asi era ref, debe ser ultra exagerado lo mio.

units:
  $extends: presets.cfx_spacing

  screw_radius: 1.1 # M2 screws
  screw_diameter: screw_radius * 2
  screw_head_radius: 2.05
  screw_head_diameter: screw_head_radius * 2
  spacer_radius: 2.15 # M2 standoffs
  spacer_diameter: spacer_radius * 2
  fillet_radius: 0.5
  via_size: 0.56 # JLCPCB min 0.56 | KiCad default 0.8
  via_drill: 0.3 # JLCPCB min 0.3 | KiCad default 0.4

  # Case variables
  case_wall_thickness: 1.2
  pcb_to_case_wall_tolerance: 0.25
  bottom_plate_thickness: 1.0
  top_plate_thickness: 1.2 # choc switches need a 1.2mm plate (1.5mm FR4 absolute max) or they do not seat
  internal_distance_between_plates: 4

  # ---- vertical stack-up (B17). Read docs/HARDWARE-STACK.md §4.0 before touching these. ----
  # Kailh PG1350 rule: the plate lives in a band whose TOP is 2.2 mm above the PCB top.
  # With a 1.2 mm plate that leaves a 1.0 mm air gap between plate and PCB.
  case_bottom_thickness: 3
  # ---- the ONE knob you may vary (B17) ----
  # Allowed range: the hotswap socket protrudes ~3.0-3.5 mm below the PCB, so the floor needs that
  # much clearance => standoff_length >= 4.5. Above ~10 mm the case just gets silly. Everything that
  # depends on it below is DERIVED, so any value in range keeps the choc band and the screw stack
  # consistent. 5 mm is the tight end (1.5 mm socket clearance); 6 mm is the BOM part; 8-10 = chunky.
  standoff_length: 6
  # ---- F3b: WHICH METAL PART SUPPLIES THE THREAD (docs/FASTENERS.md §3 F3b) ----
  # `standoff_body_length` = length of the metal part hanging BELOW the PCB. The printed boss is
  # DERIVED as standoff_length - standoff_body_length, so the two always add up to the same stack.
  # Changing this one number switches anchoring topology; nothing else needs editing.
  #   3 -> soldered XHHD M2*3+3 (LCSC C192879, 5 333 in stock). JLCPCB's PCB Assembly service
  #        (SMT + THT + mixed, double-sided) solders the 3 mm stud into the PCB; the printed boss
  #        fills the remaining 3 mm. Builder buys screws only.        <-- F3b, recommended
  #   6 -> press-fit standoff (docs/BOM.md item 12) spanning floor -> PCB, boss 0 (the old design).
  #   0 -> no metal part: the boss becomes a full-height printed post (thread in plastic = F1).
  standoff_body_length: 3
  standoff_boss_height: standoff_length - standoff_body_length
  standoff_boss_radius: 2.1 # Ø4.2; the 8.83 mm minimum key clearance allows it (FASTENERS §4.2)
  pcb_thickness: 1.2 # B15: was implicit (ergogen wrote 1.6); 1.2 is the measured board
  plate_top_above_pcb_top: 2.2
  # How much thread the screws should bite. Budget: top + bottom engagement <= standoff_length.
  screw_engagement: 2.5
  # Derived screw lengths. Neither depends on standoff_length: each screw only crosses the fixed
  # stack on its own side of the standoff, then bites `screw_engagement` into it.
  #   top: plate 1.2 + air 1.0 + PCB 1.2 + 2.5 = 5.9  -> use 6 mm
  #   bottom: floor 3.0 + 2.5 = 5.5                   -> use 6 mm
  screw_top_length: 6
  screw_bottom_length: 6

  # ---- B20 option D: the plate sits ON the wall (docs/B20-PLATE-ON-WALL.md) ----
  # 1 -> the printed wall stops at the plate's UNDERSIDE and the FR4 plate overhangs it, so the
  #      plate IS the lid: it gets full-perimeter support, nothing extra to print, no 2 mm reveal.
  # 0 -> the old geometry: the wall runs to the plate TOP (rim = plate top) and the plate is a
  #      panel that hangs inside the cavity on the 32 switch latches. Kept as the escape hatch.
  plate_sits_on_wall: 1
  # case_border_height is DERIVED, never authored. NOTE: ergogen evaluates units top-down, so every
  # symbol in this expression must be defined ABOVE it.
  #   plate_sits_on_wall = 1 -> wall top = plate UNDERSIDE
  #         3.0 floor + 6.0 standoff + 1.2 PCB + 2.2 choc band - 1.2 plate = 11.2 (= plate bottom)
  #   plate_sits_on_wall = 0 -> wall top = plate TOP (the pre-B20-D rim)
  #         3.0 + 6.0 + 1.2 + 2.2 = 12.4
  # Authoring 16 here (the original value) put the wall 3.6 mm above the plate, so CFX caps (3.7 mm)
  # ended up flush with the rim and the outer keys looked walled in.
  case_border_height: case_bottom_thickness + standoff_length + pcb_thickness + plate_top_above_pcb_top - plate_sits_on_wall * top_plate_thickness
  # USB-C opening: from the floor up to 1 mm below the wall top, so it can never break through it.
  # (it used to be a literal 10, which reached z=13 and would have cut the 12.4 rim open).
  # B20-D: the wall top is now 11.2, so the window is 7.2 tall -> z 3.0..10.2. The plate itself caps
  # it from above. See "the USB-C consequence" in docs/B20-PLATE-ON-WALL.md before raising it.
  # USB-C window: full wall height (was "1 mm below the rim"). Under B20 option D the wall stops
  # at 11.2 so the old formula gave 7.2 -> a window to z=10.2, i.e. its top edge was the PCB's top
  # face, and the nice!nano's 3.34 mm mid-mount connector could lose up to ~1.2 mm of its mouth
  # (measured, docs/B20-PLATE-ON-WALL.md §5). Taking the window to the wall top recovers 1.0 mm at
  # zero cost, and with the default D1 plate the controller bay is notched out, so nothing caps it.
  usbc_slot_height: case_border_height - case_bottom_thickness
  #TODO: aplicar offset adicional por screw minimo. porque no va a entrar asi , hay que buscar a la esquina posta. si no choca con switch.
  screw_offset_x: 0.4 kx #How much to move the screw from the reference point. To avoid landing inside the switches
  screw_offset_y: -0.2 ky #how much to move the screw from the referene point
  controller_area_height: 5 #How tall relative to the switch plate the controller area cover should be at
  controller_area_wall_thickness: 2 #How thick (wide) the wall of the controller area should be
  controller_area_cover_thickness: 1.6 #How thick (tall) the cover should be 

  # Font units
  font_x: 1
  font_y: 1
  font_xo: 0.5 font_x
  font_yo: 0.5 * font_y

  # Nice Nano
  mcu_spacing_x: 2.72
  mcu_x: 17.78 + mcu_spacing_x
  mcu_y: 33.02
  mcu_xo: 0.5 * mcu_x
  mcu_yo: 0.5 * mcu_y  

  # Battery Connector
  batc_x: 4.3
  batc_y: 4.6
  batc_xo: 0.5 * batc_x
  batc_yo: 0.5 * batc_y

  # Battery Pads
  batp_x: 3.75
  batp_y: 2.5
  batp_xo: 0.5 * batp_x
  batp_yo: 0.5 * batp_y

  # Power Switch
  sw_power_x: 3.1
  sw_power_y: 8.3
  sw_power_xo: 0.5 * sw_power_x
  sw_power_yo: 0.5 * sw_power_y

  # Reset Switch
  sw_reset_x: 3.4
  sw_reset_y: 5
  sw_reset_xo: 0.5 * sw_reset_x
  sw_reset_yo: 0.5 * sw_reset_y

  #How much pcb to generate arround the center of the controller
  #Its better for it to be on the bigger side to ensure there are no gaps between it and the keyboard pcb area
  #As long as you also offset it with negative y it shouldnt be a problem
  controller_sorrounding_x: 50 
  controller_sorrounding_y: 30
  l_controller_area_x_shift: 8
  r_controller_area_x_shift: 8
  l_controller_area_y_shift: -5
  r_controller_area_y_shift: -5
  controller_center_y_shift: -2 #How much to move the center of the controller upward in y
  controller_area_roof_z_thickness: 2 

points:
  key:
    padding: ky
    spread: kx
    width: keycap_x_1u
    height: keycap_x_1u
    mirror:
      tags: ["key", "rightkey"]
  zones:
    matrix:
      # Make placement on kicad sheet fixed
      anchor:
        shift: [35, -150]
      key.tags: [
        "key",
        "leftkey"
        ] #When keys are not mirrored tag them with key, right
      columns:
        col1:
          key.column_net: C1
          key.stagger: 0
          rows:
            row5:
              skip: true
        col2:
          key.column_net: C2
          key.stagger: 0.25 ky
        col3:
          key.column_net: C3
          key.stagger: 0.66 ky
        col4:
          key.column_net: C4
          key.stagger: -0.25 ky
          rows:
            row5:
              skip: true
        col5:
          key.column_net: C5
          key.stagger: -0.15 ky
          rows:
            row5:
              skip: true
        col6:
          key.column_net: C6
          key.stagger: -0.2 ky
          rows:
            row5:
              skip: true
        col7:
          key.column_net: C7
          key.stagger: .2 ky
          rows:
            row1:
              skip: true
            row5:
              skip: true
      rows:
        row5:
          row_net: R5
        row4:
          row_net: R4
        row3:
          row_net: R3
        row2:
          row_net: R2
        row1:
          row_net: R1
      mirror:
        #shift: [35, -150]
        distance: 340

    thumbfan:
      key.tags: ["key", "leftkey"] #When keys are not mirrored tag them with key, right
      anchor:
        ref: matrix_col6_row4
        shift: [-0.66 kx, -1 ky]
        rotate: -10
      columns:
        col1:
          key:
            spread: kx
            column_net: C5
        col2:
          key:
            spread: kx
            splay: -15
            origin: [-0.5 kx, -0.5 ky]
            column_net: C6
        col3:
          key:
            spread: kx
            splay: -5
            origin: [-0.5 kx, -0.5 ky]
            column_net: C7
      rows:
        thumb_row_1:
          row_net: R5
      mirror:
        ref: matrix_col6_row4
        distance: 100
        #200 #mirrors 200 away from the other cluster which isnt right

    controller_center: #The point exactly in the middle of the controller, the controller is drawn arround it
      anchor:
        ref: matrix_col4_row1
        shift: [-0.25*kx, 0.5 ky + mcu_y/2 + controller_center_y_shift]
      key:
        name: mcu #the name that other areas can reference to use as point
        width: mcu_y #Likely the outline of the controller itself but does not affect the area arround it
        height: mcu_x #Likely the outline of the controller itself but does not affect the area arround it
        tags: ["controller_center", "left_controller_center"]
        mirror.tags: ["controller_center", "right_controller_center"]
      mirror:
        ref: matrix_col4_row1
        #shift: [-0.25*kx, 0.5 ky + mcu_y/2 + controller_center_y_shift]
        # 168 = a TRUE mirror: axis = anchor.x + distance/2 = 86 + 84 = 170, the same axis the
        # keys mirror about. It was 165 (axis 168.5), which put the right half's MCU / controller
        # bay / JST / USB-C block 3.0 mm closer to the seam than a mirrored left. Then no right
        # outline is a mirror, and the printed halves differ at the bay (see docs/B5-RIGHT-3D.md).
        distance: 168
      #mirror: 200 #Mirrors 200 away from the controller which isnt right

    l_jsph_area_center:
      anchor:
        ref: mcu
        shift: [mcu_x/2 +19, -14]
        rotate: 270
      key:
        tags:
          ['l_jsph_area_center']

    r_jsph_area_center:
      anchor:
        ref: mirror_mcu
        shift: [mcu_x/2 +19, -14]
        rotate: 270
      key:
        tags:
          ['r_jsph_area_center']


    l_controller_area_center:
      anchor:
        ref: mcu
        shift: [l_controller_area_x_shift, l_controller_area_y_shift]
      key:
        tags: ['l_controller_area_center']

    r_controller_area_center:
      anchor:
        ref: mirror_mcu
        shift: [r_controller_area_x_shift, r_controller_area_y_shift]
      key:
        tags: ['r_controller_area_center']
  #Creates the mirror for the entire matrix x units way from the ref
  #mirror: 200 #&mirror
    #ref: matrix_col7_row2
    #shift: [0, + ky]
    #distance: 100
    #key.tags: [key,mirrorkey]
    
    #TODO AGREGAR SILKSCREEN PARA SCREWS PARA QUE NO SE PONGAN CIRCUITOS ABAJO!
    # Right twins use mirrored key anchors and preserve the B13 left screw shifts.
    #Define the points at which we need to make each screw hole
    l_screw_left_top:
      anchor:
        - ref: matrix_col1_row1
          shift: [screw_offset_x + 2, screw_offset_y + -0.75]  # B13: was (41.8, 85.4)
      key.tags:
        - left_screw
    r_screw_left_top:
      anchor:
        - ref: mirror_matrix_col1_row1
          shift: [screw_offset_x + 2, screw_offset_y + -0.75]
      key.tags:
        - right_screw
    l_screw_left_bottom:
      anchor:
        - ref: matrix_col1_row4
          shift: [screw_offset_x + 2, screw_offset_y + -0.75]  # B13: was (41.8, 136.4)
      key.tags:
        - left_screw
    r_screw_left_bottom:
      anchor:
        - ref: mirror_matrix_col1_row4
          shift: [screw_offset_x + 2, screw_offset_y + -0.75]
      key.tags:
        - right_screw
    l_screw_right_top:
      anchor:
        - ref: matrix_col6_row1
          shift: [screw_offset_x + 2, screw_offset_y + 0]  # B13: was (126.8, 80.13)
      key.tags:
        - left_screw
    r_screw_right_top:
      anchor:
        - ref: mirror_matrix_col6_row1
          shift: [screw_offset_x + 2, screw_offset_y + 0]
      key.tags:
        - right_screw
    l_screw_right_bottom:
      anchor:
        - ref: matrix_col6_row4
          shift: [screw_offset_x + 2, screw_offset_y + -1.5]  # B13: was (126.8, 131.13)
      key.tags:
        - left_screw
    r_screw_right_bottom:
      anchor:
        - ref: mirror_matrix_col6_row4
          shift: [screw_offset_x + 2, screw_offset_y + -1.5]
      key.tags:
        - right_screw
    l_screw_thumb:
      anchor:
        - ref: thumbfan_col2_thumb_row_1
          shift: [screw_offset_x + 1.65, screw_offset_y - 3.506]  # B13: was (131.70,156.42); lands at (131.70,160.30) — clears the 14 mm cutouts, the plate OUTLINE (was 1.07 mm -> clipped notch) and stays ~10.9 mm from any key  # B13: was (131.70,156.42); lands at (131.70,160.30) — clears the 14 mm cutouts, the plate OUTLINE (was 1.07 mm -> clipped notch) and stays 10.9 mm from any key  # B13: was (131.70,156.42); lands at (131.70,160.30) — clears plate cutouts, the plate OUTLINE (was 1.07 mm -> notch) and stays 10.9 mm from any key  # B13: was (131.70,156.42), thumb frame is rotated ~25 deg  # B13: was (131.70,156.42)  # B13: was (131.70,156.42)  # B13: was (131.7, 156.42)
      key.tags:
        - left_screw
    r_screw_thumb:
      anchor:
        - ref: mirror_thumbfan_col2_thumb_row_1
          shift: [screw_offset_x + 1.65, screw_offset_y - 3.506]
      key.tags:
        - right_screw

outlines:
  l_key_based_board_outline:
    - what: rectangle
      where: leftkey
      #asym: source
      size: [kx + px, ky + py]
      #corner: px #Havig it set to 3.5 (while px was 3.5) made ergogen create a huge arc for some reason. it did not happen with other decimals, nor 3, nor 4
      corner: 3
  
  l_key_based_board_outline_with_extra_padding:
    - what: rectangle
      where: leftkey
      #asym: source
      size: [kx + px + 3, ky + py +3]
      #corner: px #Havig it set to 3.5 (while px was 3.5) made ergogen create a huge arc for some reason. it did not happen with other decimals, nor 3, nor 4
      corner: 3

  r_key_based_board_outline:
    - what: rectangle
      where: rightkey
      #asym: source
      size: [kx + px, ky + py]
      corner: 3
      #corner: px #Havig it set to this value made ergogen create a huge arc for some reason.

  r_key_based_board_outline_with_extra_padding:
    - what: rectangle
      where: rightkey
      #asym: source
      size: [kx + px + 3, ky + py +3]
      #corner: px #Havig it set to 3.5 (while px was 3.5) made ergogen create a huge arc for some reason. it did not happen with other decimals, nor 3, nor 4
      corner: 3

  l_thumb_suplementary_outline:
    - what: polygon
      points:
        - ref: matrix_col6_row4
          shift: [0.5 kx + 0.5px, -0.5 ky + 0.5 py]
        - ref: matrix_col6_row4
          shift: [0.5 kx + 0.5px, -0.5 ky + 0.5 py - 5]
        - ref: thumbfan_col3_thumb_row_1
          shift: [0.5 kx - 0.5px, 0.5 ky + 0.5 py]
        - ref: thumbfan_col3_thumb_row_1
          shift: [0.5 kx - 0.5px, -0.5 ky - 0.5 py]
        - ref: thumbfan_col2_thumb_row_1
          shift: [0.5 kx - 0.5px, -0.5 ky - 0.5 py]
        - ref: thumbfan_col2_thumb_row_1
          shift: [-0.5 kx - 0.5px, -0.5 ky - 0.5 py]
        - ref: thumbfan_col1_thumb_row_1
          shift: [-0.5 kx + 0.5 px, -0.5 ky - 0.5 py]
        - ref: matrix_col2_row4
          shift: [0.5 kx - 0.5 py, -0.5 ky - 0.5 py]
        - ref: matrix_col2_row3
        - ref: matrix_col6_row3

  r_thumb_suplementary_outline:
    - what: polygon
      points:
        - ref: mirror_matrix_col6_row4
          shift: [0.5 kx + 0.5px, -0.5 ky + 0.5 py]
        - ref: mirror_thumbfan_col3_thumb_row_1
          shift: [0.5 kx - 0.5px, 0.5 ky + 0.5 py]
        - ref: mirror_thumbfan_col3_thumb_row_1
          shift: [0.5 kx - 0.5px, -0.5 ky - 0.5 py]
        - ref: mirror_thumbfan_col1_thumb_row_1
          shift: [-0.5 kx + 0.5 px, -0.5 ky - 0.5 py]
        - ref: mirror_matrix_col2_row4
          shift: [0.5 kx - 0.5 py, -0.5 ky - 0.5 py]
        - ref: mirror_matrix_col2_row3
        - ref: mirror_matrix_col6_row3


  l_all_key_clusters_outline:
    - "+l_key_based_board_outline"
    #- "+l_thumb_suplementary_outline"

  r_all_key_clusters_outline:
    - "+r_key_based_board_outline"
  #  - "+r_thumb_suplementary_outline"


  l_controller_area: #The pcb arround the controller (incluiding it)
    - what: rectangle
      where: l_controller_area_center
      size: [controller_sorrounding_x, controller_sorrounding_y]
      corner: 3

  r_controller_area: #The pcb arround the controller (incluiding it)
    - what: rectangle
      where: r_controller_area_center
      size: [controller_sorrounding_x, controller_sorrounding_y]
      corner: 3

  l_controller_area_to_cover_outline:
    - "+l_controller_area"
    - "-l_key_based_board_outline"
  
  l_controler_area_to_not_fill:
    - what: outline
      name: l_controller_area_to_cover_outline
      expand: -2

  # B5: right twins of the two controller-housing outlines. `r_cover` needs them; without them
  # the right cover would have no controller housing. Same construction as the left, on the
  # right-side inputs, so the two halves stay comparable.
  r_controller_area_to_cover_outline:
    - "+r_controller_area"
    - "-r_key_based_board_outline"

  r_controler_area_to_not_fill:
    - what: outline
      name: r_controller_area_to_cover_outline
      expand: -2

  l_jsph_area:
    - what: rectangle
      where: l_jsph_area_center
      size: [18, 14]
      corner: 3

  r_jsph_area:
    - what: rectangle
      where: r_jsph_area_center
      size: [18, 14]
      corner: 3

  l_pcb_outline:
    - "+l_key_based_board_outline"
    #- "+l_thumb_suplementary_outline"
    - "+l_controller_area"
    - "+l_jsph_area"

  r_pcb_outline:
    - "+r_key_based_board_outline"
    #- "+r_thumb_suplementary_outline"
    - "+r_controller_area"
    - "+r_jsph_area"

  l_controller_area_cover: #The area that will cover the controller
    - what: outline
      name: l_controller_area
      expand: controller_area_wall_thickness

  r_controller_area_cover: #The area that will cover the controller
    - what: outline
      name: r_controller_area
      expand: controller_area_wall_thickness

  #Create the wall for the left controller area that sits below the area that covers it.
  l_controller_area_border:
    - what: outline
      name: l_controller_area_cover
    - operation: subtract
      what: outline
      name: l_controller_area

  #Create the wall for the left controller area that sits below the area that covers it.
  r_controller_area_border:
    - what: outline
      name: r_controller_area_cover
    - operation: subtract
      what: outline
      name: r_controller_area

  l_jsph_area_cover: #The area that will cover the jsph
    - what: outline
      name: l_jsph_area
      expand: controller_area_wall_thickness

  r_jsph_area_cover: #The area that will cover the jsph
    - what: outline
      name: r_jsph_area
      expand: controller_area_wall_thickness

  #Create the wall for the left jsph area that sits below the area that covers it.
  l_jsph_area_border:
    - what: outline
      name: l_jsph_area_cover
    - operation: subtract
      what: outline
      name: l_jsph_area

  #Create the wall for the left jsph area that sits below the area that covers it.
  r_jsph_area_border:
    - what: outline
      name: r_jsph_area_cover
    - operation: subtract
      what: outline
      name: r_jsph_area

  l_screws_outline:
    - what: circle
      where: [left_screw]
      radius: screw_radius

  # F3b: threadless post at each screw point (height = standoff_boss_height).
  # Hollow, because the screw passes through it into the metal part above.
  l_standoff_bosses:
    - what: circle
      where: [left_screw]
      radius: standoff_boss_radius
    - operation: subtract
      what: circle
      where: [left_screw]
      radius: screw_radius

  r_screws_outline:
    - what: circle
      where: [right_screw]
      radius: screw_radius

  # F3b: threadless post at each screw point (height = standoff_boss_height).
  # Hollow, because the screw passes through it into the metal part above.
  r_standoff_bosses:
    - what: circle
      where: [right_screw]
      radius: standoff_boss_radius
    - operation: subtract
      what: circle
      where: [right_screw]
      radius: screw_radius

  l_case_bottom:
    - what: outline
      name: l_pcb_outline
      expand: 4
    - operation: subtract
      name: l_screws_outline

  r_case_bottom:
    - what: outline
      name: r_pcb_outline
      expand: 4
    - operation: subtract
      name: r_screws_outline

  l_case_border_do_not_ocupy:
    - what: outline
      name: l_pcb_outline
      expand: 2

  r_case_border_do_not_ocupy:
    - what: outline
      name: r_pcb_outline
      expand: 2

  l_case_border:
    #Keep everything to from the border of the case bottom to slightly arround the pcb
    - what: outline
      name: l_case_bottom
    - operation: subtract
      what: outline
      name: l_case_border_do_not_ocupy

  r_case_border:
    #Keep everything to from the border of the case bottom to slightly arround the pcb
    - what: outline
      name: r_case_bottom
    - operation: subtract
      what: outline
      name: r_case_border_do_not_ocupy

  ##### Preparing for tenting system
  l_tenting_base_bottom_outline: # B16: ring from PCB edge out to case_bottom+2 (6 mm wide)
    #Sorround the bottom
    - what: outline
      name: l_case_bottom
      expand: 2
    #And go inward to the PCB edge (this is what makes it a RING, not a solid slab)
    - what: outline
      name: l_pcb_outline
      operation: subtract
    #- what: outline
    #  name: l_case_bottom
    #  expand : -5
    #  operation: subtract

  r_tenting_base_bottom_outline: # B16 fix: true mirror of the left (was l_case_bottom twice -> empty geometry)
    #Sorround the bottom
    - what: outline
      name: r_case_bottom
      expand: 2
    #And go inward to the PCB edge (must match the left construction exactly)
    - what: outline
      name: r_pcb_outline
      operation: subtract

  l_tenting_base_border_outline: ####HERE IS NO PROBLEM
    #Sorround the bottom 
    - what: outline
      name: l_case_bottom
      expand: 2
    #And go inward slightly to generate a wall
    - what: outline
      name: l_case_bottom
      expand : 1
      operation: subtract

  r_tenting_base_border_outline:
    #Sorround the bottom 
    - what: outline
      name: r_case_bottom
      expand: 2
    #And go inward slightly to generate a wall
    - what: outline
      name: r_case_bottom
      expand : 1
      operation: subtract
  #################################

  # l_case_border_outline:
  #   # remove the pcb outline from an outline with exta padding
  #   - name: l_key_based_board_outline_with_extra_padding
  #   - operation: subtract
  #     name: l_key_based_board_outline

  l_keys_outline:
    - what: rectangle
      where: [[leftkey]]
      size: [plate_kx, plate_ky] # NOTE: rectangle.size is the FULL extent, not half

  r_keys_outline:
    - what: rectangle
      where: [[rightkey]]
      size: [plate_kx, plate_ky]

  l_coverpart_switch_plate_outline: 
  # The top plate of the keyboard with the holes for the key switches bottom to go through and the edges for their middle to sit at.
  #Probably should not use the left pcb outline directly because the MCU is probably taller than the height we want the plate to have
  #And therefore htat should be 
    - name: l_all_key_clusters_outline
    - operation: subtract
      name: l_keys_outline
    - operation: subtract
      name: l_screws_outline

  r_coverpart_switch_plate_outline: 
  # The top plate of the keyboard with the holes for the key switches bottom to go through and the edges for their middle to sit at.
  #Probably should not use the left pcb outline directly because the MCU is probably taller than the height we want the plate to have
  #And therefore htat should be 
    - name: r_all_key_clusters_outline
    - operation: subtract
      name: r_keys_outline
    - operation: subtract
      name: r_screws_outline

  l_cover_outline:
    - name: l_pcb_outline #r_all_key_clusters_outline
    - operation: subtract
      name: l_keys_outline

  r_cover_outline:
    - name: r_pcb_outline #r_all_key_clusters_outline
    - operation: subtract
      name: r_keys_outline

  ########### B20 option D: the FR4 plate is the case FOOTPRINT (it sits on the wall) ###########
  # Today's plate (l_coverpart_switch_plate_outline) is the *key cluster*, i.e. 2-4 mm smaller than
  # the cavity, so it hangs from the switch latches with nothing under its edge (B20). Under D the
  # wall stops at 11.2 and the plate (11.2..12.4) overhangs it, so the plate must be the case
  # footprint: l_case_bottom = l_pcb_outline expanded 4 mm, ALREADY minus the 5 screw bores.
  # Two variants, because the controller bay has to stay reachable (B18) and the MCU / JST bodies are
  # 3.34 / 7.60 mm tall -- far taller than the 1.0 mm air gap under the plate:
  #   l_plate_on_wall_bay  (D1, DEFAULT) : footprint - keys - screws - controller bay - JSPh bay
  #   l_plate_on_wall      (D2)          : footprint - keys - screws   (bay covered)
  l_plate_on_wall_bay:
    - name: l_case_bottom # the case footprint (PCB + 4, minus the screw bores)
    - operation: subtract
      name: l_keys_outline
    - operation: subtract
      name: l_controller_area # MCU / reset / power / display bay stays open -> B18 stays true
    - operation: subtract
      name: l_jsph_area # the JST-PH battery connector is 7.60 mm tall; it MUST be notched

  l_plate_on_wall:
    - name: l_case_bottom
    - operation: subtract
      name: l_keys_outline

  r_plate_on_wall_bay:
    - name: r_case_bottom
    - operation: subtract
      name: r_keys_outline
    - operation: subtract
      name: r_controller_area
    - operation: subtract
      name: r_jsph_area

  r_plate_on_wall:
    - name: r_case_bottom
    - operation: subtract
      name: r_keys_outline

  l_usbc_border_outline:
    - what: rectangle
      where: left_controller_center
      size: [15, 15] #usbc connectors are apparently ~8.94 width, and ~ 4mm high , width is the second value in my file. With 15 a cable fits with the case with room to spare

  r_usbc_border_outline:
    - what: rectangle
      where: right_controller_center
      size: [15, 15] #usbc connectors are apparently ~8.94 width, and ~ 4mm high , width is the second value in my file. With 15 a cable fits with the case with room to spare


  l_hand_rest_overlapping_polygon: #A polygon that extends above the keyboard, from which we need to remove the keyboard in order to make the hand rest polygon.
    - what: polygon
      operation: stack
      points: 
      - ref: matrix_col1_row4
        shift: [-0.5*kx-0.5*px,0] #end at the left border of the key instead of the center
      - ref: matrix_col6_row4
        shift: [0,0]
      - ref: mirror_thumbfan_col1_thumb_row_1
        shift: [0,0]
      - ref: thumbfan_col2_thumb_row_1
        shift: [0,0]
      - ref: thumbfan_col3_thumb_row_1
        shift: [0.5*kx+0.5*px,0]
      - ref: thumbfan_col3_thumb_row_1
        shift: [0.5*kx+0.5*px-5,-50] #make each bottom border end slightly inner in comparison with the original shape, to look better
      - ref: matrix_col1_row4
        shift: [-0.5*kx-0.5*px+5,-50]

  r_hand_rest_overlapping_polygon: #A polygon that extends above the keyboard, from which we need to remove the keyboard in order to make the hand rest polygon.
    - what: polygon
      operation: stack
      points: 
      - ref: mirror_matrix_col1_row4
        shift: [-0.5*kx-0.5*px,0] #end at the left border of the key instead of the center
      - ref: mirror_matrix_col6_row4
        shift: [0,0]
      - ref: mirror_thumbfan_col1_thumb_row_1
        shift: [0,0]
      - ref: mirror_thumbfan_col2_thumb_row_1
        shift: [0,0]
      - ref: mirror_thumbfan_col3_thumb_row_1
        shift: [0.5*kx+0.5*px,0]
      - ref: mirror_thumbfan_col3_thumb_row_1
        shift: [0.5*kx+0.5*px-5,-50] #make each bottom border end slightly inner in comparison with the original shape, to look better
      - ref: mirror_matrix_col1_row4
        shift: [-0.5*kx-0.5*px+5,-50]

  l_hand_rest_polygon:
    - name: l_hand_rest_overlapping_polygon
    - operation: subtract
      name: l_key_based_board_outline_with_extra_padding #l_case_border_outline

  r_hand_rest_polygon:
    - name: r_hand_rest_overlapping_polygon
    - operation: subtract
      name: r_key_based_board_outline_with_extra_padding #r_case_border_outline

  # preview showing outline and keys.
  #combined:
  #  - name: r_cover_outline
    # - operation: stack
    #   name: right_cover_outline


pcbs:
  # ---- B20-D: the plate is the lid, so there are TWO orderable outlines per half ----
  # `plate_left` / `plate_right` keep working and point at the D1 (bay open) variant, which is the
  # recommendation. The `_bay` / `_full` twins are the explicit names; `_full` (bay covered) is for
  # inspecting D2 only -- it lays FR4 over the 3.34 mm MCU and the 7.60 mm JST connector.
  plate_left_bay:
    template: kicad8
    outlines:
      right:
        outline: l_plate_on_wall_bay
    footprints:
      url:
        what: ceoloide/utility_text
        params:
          text: *kb_url
        adjust:
          shift: [0,-6]
        where:
          - [ key, -1_5u, space]
      jlc:
        what: ceoloide/utility_text
        params:
          text: JLCJLCJLCJLC
          side: B
          mirrored: true
        adjust:
          shift: [0, 6]
        where:
          - [ key, -1_5u, space]
  plate_left_full:
    template: kicad8
    outlines:
      right:
        outline: l_plate_on_wall
    footprints:
      url:
        what: ceoloide/utility_text
        params:
          text: *kb_url
        adjust:
          shift: [0,-6]
        where:
          - [ key, -1_5u, space]
  plate_right_bay:
    template: kicad8
    outlines:
      right:
        outline: r_plate_on_wall_bay
    footprints:
      jlc:
        what: ceoloide/utility_text
        params:
          text: JLCJLCJLCJLC
          side: B
          mirrored: true
        adjust:
          shift: [0, 6]
        where:
          - [ /^mirror.*/, key, -1_5u, space]
      url:
        what: ceoloide/utility_text
        params:
          text: *kb_url
        adjust:
          shift: [0,-6]
        where:
          - [ /^mirror.*/, key, -1_5u, space]
  plate_right_full:
    template: kicad8
    outlines:
      right:
        outline: r_plate_on_wall
    footprints:
      jlc:
        what: ceoloide/utility_text
        params:
          text: JLCJLCJLCJLC
          side: B
          mirrored: true
        adjust:
          shift: [0, 6]
        where:
          - [ /^mirror.*/, key, -1_5u, space]
      url:
        what: ceoloide/utility_text
        params:
          text: *kb_url
        adjust:
          shift: [0,-6]
        where:
          - [ /^mirror.*/, key, -1_5u, space]
  plate_right:
    template: kicad8
    outlines:
      right:
        outline: r_plate_on_wall_bay # B20-D: default = D1, the bay stays open
    footprints:
      jlc:
        what: ceoloide/utility_text
        params:
          text: JLCJLCJLCJLC
          side: B
          mirrored: true
        adjust:
          shift: [0, 6]
        where: 
          - [/^mirror.*/, key, -1_5u, space]
      url:
        what: ceoloide/utility_text
        params:
          text: *kb_url
        adjust:
          shift: [0,-6]
        where: 
          - [/^mirror.*/, key, -1_5u, space]
  plate_left:
    template: kicad8
    outlines:
      right:
        outline: l_plate_on_wall_bay # B20-D: default = D1, the bay stays open
    footprints:
      url:
        what: ceoloide/utility_text
        params:
          text: *kb_url
        adjust:
          shift: [0,-6]
        where: 
          - [ key, -1_5u, space]
      jlc:
        what: ceoloide/utility_text
        params:
          text: JLCJLCJLCJLC
          side: B
          mirrored: true
        adjust:
          shift: [0, 6]
        where: 
          - [ key, -1_5u, space]
  left_pcb:
    template: kicad8
    outlines:
      left:
        outline: l_pcb_outline
    footprints:
      choc:
        what: ceoloide/switch_choc_v1_v2
        where:
          - [ leftkey]
        adjust:
          rotate: 180
        params:
          include_keycap: true
          choc_v2_support: true
          #          solder: true
          reversible: false
          hotswap: true
          side: 'B'
          keycap_width: 16.5
          keycap_height: 16.5
          include_in_pos_files: true
          from: "{{colrow}}"
          to: "{{column_net}}"
          supplier_link: 'https://kailhswitch.com/products/choc-v1'
          manufacturer_part_number: 'Kailh-Choc-PG1350'
          do_not_populate: ''
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/Choc_V1_Switch.step"
          model_xyz_rotation: [180, 0, 0]
      choc_hotswap:
        what: ceoloide/hs-socket-fab-preview_choc_v1_v2
        where:
          - [ leftkey]
        adjust:
          rotate: 180
        params:
          side: 'B'
          from: "{{colrow}}"
          to: "{{column_net}}"
          # 3D Model
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/Choc_V1_Hotswap.step"
          model_xyz_rotation: [180, 0, 0]
          model_xyz_offset: [0, 0, -1.5]
          # Supplier Link (optional)
          supplier_link: 'https://kailhswitch.com/products/hotswap-socket'
          # Manufacturer Part Number (optional)
          manufacturer_part_number: 'Kailh-Hotswap-PG1350'
          # DNP Flag (optional - set to 'DNP' to indicate the manufacturer should not try to place the part automatically)
          do_not_populate: ''
      choc_keycap:
        what: ceoloide/keycap-fab-preview_choc_v1_v2
        where:
          - [ leftkey]
        adjust:
          rotate: 180
        params:
          side: 'B'
          from: "{{colrow}}"
          to: "{{column_net}}"
          # 3D Model
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/Choc_V1_Keycap_MBK_White_1u.step"
          model_xyz_rotation: [180, 0, 0]
          model_xyz_offset: [0, 0, -7] #third axis is vertical
          # Supplier Link (optional)
          supplier_link: 'https://mechanicalkeyboards.com/product/mbk-choc'
          # Manufacturer Part Number (optional)
          manufacturer_part_number: 'MBK-Choc-1u-White'
          # DNP Flag (optional - set to 'DNP' to indicate the manufacturer should not try to place the part automatically)
          do_not_populate: 'DNP'
      choc_space:
        what: ceoloide/switch_choc_v1_v2
        where:
          - [ leftkey, -1_5u, space]
        adjust:
          rotate: 180
        params:
          include_keycap: true
          choc_v2_support: true
          #solder: true
          reversible: false
          hotswap: true
          side: 'B'
          keycap_width: keycap_x_space
          keycap_height: 16.5
          include_in_pos_files: true
          from: "{{colrow}}"
          to: "{{column_net}}"
          # Supplier Links (optional)
          supplier_link: 'https://kailhswitch.com/products/choc-v1'
          # Manufacturer Part Numbers (optional)
          manufacturer_part_number: 'Kailh-Choc-PG1350'
          # DNP Flag (optional - set to 'DNP' to indicate the manufacturer should not try to place the part automatically)
          do_not_populate: ''
          # 3D Models
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/Choc_V1_Switch.step"
          model_xyz_rotation: [180, 0, 0]
      diode:
        what: ceoloide/diode_tht_sod123
        where:
          - leftkey
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          side: F
          include_tht: false
          reversible: false
          diode_3dmodel_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/D_SOD-123.step"
          diode_3dmodel_xyz_offset: [0, 0, 0]
          diode_3dmodel_xyz_scale: [1, 1, 1]
          diode_3dmodel_xyz_rotation: [0, 0, 0]
        adjust:
          shift: [horizontal_diode_shift,vertical_diode_shift]
          rotate: 90 + diode_rotation

      promicro:
        what: ceoloide/mcu_nice_nano
        params:
          reverse_mount: true
          include_extra_pins: true
          mcu_3dmodel_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/Nice_Nano_V2.step"
          mcu_3dmodel_xyz_offset: [0, 0, 2.5]
          mcu_3dmodel_xyz_scale: [1, 1, 1]
          mcu_3dmodel_xyz_rotation: [0, 0, 0]
          # Pin Assignments (Controller on top facing down)
          # Right Side
          P0: "DPD" # Display Data
          P1: "DPC" # Display Clock
          # GND
          # GND
          P2: "DPE" # Display CS (nice!view only) FIXME? ZPM default?
          #MODIFIED
          # Creo que tal vez la lcave no es separarlos si no poner bien al borde los de rows, empezando mas afuera los de mas abajo y
          #los de columns si lo mas separados posibles para el lugar correcot.
          # B1 (fixed 2026-11-16): rows are R1..R5, so the pins must form a bijection with
          # them. This block had NO pin on R1 (every R1 key dead) and two pins on R5
          # (shorted GPIOs); R6/R7 were assigned to nets no key uses. Order matches the
          # configurator generator (row5..row1 against ROW_PIN_POOL P3..P7).
          P3: "R5" # Row
          P4: "R4" # Row
          P5: "R3" # Row
          P6: "R2" # Row
          P7: "R1" # Row
          # P8 / P9 deliberately free (were R6 / R7 =nounused nets -> wasted pins)

          # Left Side
          # RAW:      # Battery Pos
          # GND       # Ground / Battery Neg
          # RST       # Reset pin
          # VCC       # External Power
          P21: "C1" # Column
          P20: "C2" # Column
          P19: "C3" # Column
          P18: "C4" # Column
          P15: "C5" # Column
          P14: "C6" # Column
          P16: "C7" # Column
          # P10: "F10" # Free
        adjust:
          rotate: 90
        where:
          ref: mcu

      # Pin Header 3D previews - virtual footprints for 3D visualization
      # Left header (column side) - positioned at the left pin row border
      header_left:
        what: ceoloide/header-preview_nano
        params:
          side: 'F'
          pin_count: 12
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/PinHeader_1x12_P2.54mm_Vertical.step"
          # Header positioned at left pin row (X=-7.62 in footprint coords)
          # With 90° rotation, this becomes Y offset
          # Z offset places header at correct height above PCB
          #side, of the controller, front of the controller, upward is negative
          model_xyz_offset: [-7.62, 12.5, 0]
          model_xyz_rotation: [0, 0, 0]
          supplier_link: 'https://www.digikey.com/en/products/detail/sullins-connector-solutions/PPTC121LFMS-RC/810154'
          manufacturer_part_number: 'PPTC121LFMS-RC'
          do_not_populate: 'DNP'
        adjust:
          rotate: 90
        where:
          ref: mcu

      # Right header (row side) - positioned at the right pin row border
      header_right:
        what: ceoloide/header-preview_nano
        params:
          side: 'F'
          pin_count: 12
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/PinHeader_1x12_P2.54mm_Vertical.step"
          # Header positioned at right pin row (X=7.62 in footprint coords)
          # With 90° rotation, this becomes Y offset
          model_xyz_offset: [7.62, 12.5 , 0] #segundo es para abajo
          model_xyz_rotation: [0, 0, 0]
          supplier_link: 'https://www.digikey.com/en/products/detail/sullins-connector-solutions/PPTC121LFMS-RC/810154'
          manufacturer_part_number: 'PPTC121LFMS-RC'
          do_not_populate: 'DNP'
        adjust:
          rotate: 90
        where:
          ref: mcu

      pads_bat:
        what: ceoloide/battery_connector_jst_ph_2
        params:
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/JSTPH2-S2B-PH-K-LF-SN.step"
          model_xyz_rotation: [-90,0,0]
          model_xyz_offset: [0,1.5,0]
          model_xyz_scale: [1, 1, 1]
        where:
          ref: mcu
          shift: [mcu_x/2 +22, -10]
          rotate: 270
      reset:
        what: ceoloide/reset_switch_smd_side
        params:
          side: F #The same side that most switches height are, to avoid adding unnecessary height
          from: GND
          to: RST
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/EVQ-PUC02K.step"
          model_xyz_offset: [0, 0, 0]
          model_xyz_rotation: [180, 180, 0]
        adjust:
          rotate: 270
        where:
          ref: mcu
          shift: [mcu_x/2 +18 +2, -0]
      power:
        what: ceoloide/power_switch_smd_side
        params:
          side: F #The same side that most switches height are, to avoid adding unnecessary height
          #          from: GND
          #          to: RST
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/SSSS811101--3DModel-STEP-269445.STEP"
          model_xyz_offset: [0, 0, 0]
          model_xyz_rotation: [90, 180, 90]
        adjust:
          rotate: 90
        where:
          ref: mcu
          shift: [mcu_x/2 +16, 8]
      # url:
      #   what: ceoloide/utility_text
      #   params:
      #     text: *kb_url
      #     reversible: true
      #   adjust:
      #     shift: [0,-6]
      #   where: 
      #     - [key, -1_5u, space]
      # version:
      #   what: ceoloide/utility_text
      #   params:
      #     text: *kb_version
      #   adjust:
      #     shift: [0,-6]
      #   where: 
      #     ref: mcu
      #     shift: [-mcu_y/2 -22,  -2]
      jlc:
        what: ceoloide/utility_text
        params:
          text: JLCJLCJLCJLC
          side: F
        adjust:
          shift: [0, 10]
        where: 
          - [key, -1_5u, space]
      screws:
        what: ceoloide/mounting_hole_npth
        where: left_screw
        params:
          hole_size: screw_diameter
          hole_drill: screw_diameter

      # Standoff 3D previews - virtual footprints for 3D visualization
      # Positioned at standoff height above PCB
      standoffs:
        what: ceoloide/standoff-preview
        where: left_screw
        params:
          screw_diameter: m2
          length: standoff_length  # B17: single source of truth (was a literal 6)
          model_xyz_offset: [0,0,-10]
          model_xyz_rotation: [90,0,0]
          # model_filename auto-selected based on screw_diameter and length
          # model_xyz_offset auto-calculated (centers standoff vertically)
          do_not_populate: DNP

      # Top screws - hold the plate to the standoff
      # Sandwich: screw (top) → plate → standoff → case → screw (bottom)
      screws_top:
        what: ceoloide/screw-preview-top
        where: left_screw
        params:
          screw_diameter: m2
          length: screw_top_length  # B21: derived minimum 5.9 mm; was 4 (only 0.6 mm of bite)
          head_type: low_socket  # Options: pan, low_socket, flat
          standoff_height: standoff_length  # must match the real standoff
          plate_thickness: top_plate_thickness  # Switch plate thickness
          # model_filename auto-selected based on parameters
          # model_xyz_offset auto-calculated based on standoff_height + plate_thickness
          do_not_populate: DNP
          model_xyz_offset: [0,0,-1.25]

      # Bottom screws - hold the case to the standoff
      screws_bottom:
        what: ceoloide/screw-preview-bottom
        where: left_screw
        params:
          screw_diameter: m2
          length: screw_bottom_length  # B21: derived minimum 5.5 mm; was 4 (only 1.0 mm of bite)
          head_type: low_socket  # Options: pan, low_socket, flat
          case_bottom_thickness: case_bottom_thickness  # Case bottom thickness
          # model_filename auto-selected based on parameters
          # model_xyz_offset auto-calculated (negative, below case)
          do_not_populate: DNP

  right_pcb:
    template: kicad8
    outlines:
      right:
        outline: r_pcb_outline
    footprints:
      choc:
        what: ceoloide/switch_choc_v1_v2
        where:
          - [/^mirror.*/, key, -1_5u, -space]
          - /rightcluster_.*/
        adjust:
          rotate: 180
        params:
          include_keycap: true
          choc_v2_support: true
          #solder: true
          reversible: false
          hotswap: true
          side: 'B'
          keycap_width: 16.5
          keycap_height: 16.5
          include_in_pos_files: true
          from: "{{colrow}}"
          to: "{{column_net}}"
          supplier_link: 'https://kailhswitch.com/products/choc-v1'
          manufacturer_part_number: 'Kailh-Choc-PG1350'
          do_not_populate: ''
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/Choc_V1_Switch.step"
          model_xyz_rotation: [180, 0, 0]
      choc_hotswap:
        what: ceoloide/hs-socket-fab-preview_choc_v1_v2
        where:
          - [/^mirror.*/, key, -1_5u, -space]
          - /rightcluster_.*/
        adjust:
          rotate: 180
        params:
          side: 'B'
          from: "{{colrow}}"
          to: "{{column_net}}"
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/Choc_V1_Hotswap.step"
          model_xyz_rotation: [180, 0, 0]
          model_xyz_offset: [0,0,-1.5]
          supplier_link: 'https://kailhswitch.com/products/hotswap-socket'
          manufacturer_part_number: 'Kailh-Hotswap-PG1350'
          do_not_populate: ''
      choc_keycap:
        what: ceoloide/keycap-fab-preview_choc_v1_v2
        where:
          - [/^mirror.*/, key, -1_5u, -space]
          - /rightcluster_.*/
        adjust:
          rotate: 180
        params:
          side: 'B'
          from: "{{colrow}}"
          to: "{{column_net}}"
          # 3D Model
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/Choc_V1_Keycap_MBK_White_1u.step"
          model_xyz_rotation: [180, 0, 0]
          model_xyz_offset: [0, 0, -7] #third axis is vertical
          # Supplier Link (optional)
          supplier_link: 'https://mechanicalkeyboards.com/product/mbk-choc'
          # Manufacturer Part Number (optional)
          manufacturer_part_number: 'MBK-Choc-1u-White'
          # DNP Flag (optional - set to 'DNP' to indicate the manufacturer should not try to place the part automatically)
          do_not_populate: 'DNP'
      choc_space:
        what: ceoloide/switch_choc_v1_v2
        where:
          - [/^mirror.*/, key, -1_5u, space]
        adjust:
          rotate: 180
        params:
          include_keycap: true
          choc_v2_support: true
          #solder: true
          reversible: false
          hotswap: true
          side: 'B'
          keycap_width: keycap_x_space
          keycap_height: 16.5
          include_in_pos_files: true
          from: "{{colrow}}"
          to: "{{column_net}}"
          # Supplier Links (optional)
          supplier_link: 'https://kailhswitch.com/products/choc-v1'
          # Manufacturer Part Numbers (optional)
          manufacturer_part_number: 'Kailh-Choc-PG1350'
          # DNP Flag (optional - set to 'DNP' to indicate the manufacturer should not try to place the part automatically)
          do_not_populate: ''
          # 3D Models
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/Choc_V1_Switch.step"
          model_xyz_rotation: [180, 0, 0]
      diode:
        what: ceoloide/diode_tht_sod123
        where:
          - rightkey
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          side: F
          include_tht: false
          reversible: false
          diode_3dmodel_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/D_SOD-123.step"
          diode_3dmodel_xyz_offset: [0, 0, 0]
          diode_3dmodel_xyz_scale: [1, 1, 1]
          diode_3dmodel_xyz_rotation: [0, 0, 0]
        adjust:
          shift: [horizontal_diode_shift,vertical_diode_shift]
          rotate: 90 + diode_rotation

      promicro:
        what: ceoloide/mcu_nice_nano
        params:
          reverse_mount: true
          include_extra_pins: true
          mcu_3dmodel_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/Nice_Nano_V2.step"
          mcu_3dmodel_xyz_offset: [0, 0, 5]
          mcu_3dmodel_xyz_scale: [1, 1, 1]
          mcu_3dmodel_xyz_rotation: [0, 0, 0]
          # Pin Assignments (Controller on top facing down)
          # Right Side
          P0: "DPD" # Display Data
          P1: "DPC" # Display Clock
          # GND
          # GND
          P2: "DPE" # Display CS (nice!view only) FIXME? ZPM default?
          # B1 (fixed 2026-11-16): rows are R1..R5, so the pins must form a bijection with
          # them. This block had NO pin on R1 (every R1 key dead) and two pins on R5
          # (shorted GPIOs); R6/R7 were assigned to nets no key uses. Order matches the
          # configurator generator (row5..row1 against ROW_PIN_POOL P3..P7).
          P3: "R5" # Row
          P4: "R4" # Row
          P5: "R3" # Row
          P6: "R2" # Row
          P7: "R1" # Row
          # P8 / P9 deliberately free (were R6 / R7 =nounused nets -> wasted pins)

          # Left Side
          # RAW:      # Battery Pos
          # GND       # Ground / Battery Neg
          # RST       # Reset pin
          # VCC       # External Power
          P21: "C1" # Column
          P20: "C2" # Column
          P19: "C3" # Column
          P18: "C4" # Column
          P15: "C5" # Column
          P14: "C6" # Column
          P16: "C7" # Column
          # P10: "C7" # Column
        adjust:
          rotate: 90
        where:
          ref: mirror_mcu

      # Pin Header 3D previews - virtual footprints for 3D visualization
      # Left header (column side) - positioned at the left pin row border
      r_header_left:
        what: ceoloide/header-preview_nano
        params:
          side: 'F'
          pin_count: 12
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/PinHeader_1x12_P2.54mm_Vertical.step"
          # Header positioned at left pin row (X=-7.62 in footprint coords)
          # With 90° rotation, this becomes Y offset
          model_xyz_offset: [-7.62, 12.5 , 0] #segundo es para abajo]
          model_xyz_rotation: [0, 0, 0]
          supplier_link: 'https://www.digikey.com/en/products/detail/sullins-connector-solutions/PPTC121LFMS-RC/810154'
          manufacturer_part_number: 'PPTC121LFMS-RC'
          do_not_populate: 'DNP'
        adjust:
          rotate: 90
        where:
          ref: mirror_mcu

      # Right header (row side) - positioned at the right pin row border
      r_header_right:
        what: ceoloide/header-preview_nano
        params:
          side: 'F'
          pin_count: 12
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/PinHeader_1x12_P2.54mm_Vertical.step"
          # Header positioned at right pin row (X=7.62 in footprint coords)
          # With 90° rotation, this becomes Y offset
          model_xyz_offset: [7.62, 12.5 , 0] #segundo es para abajo
          model_xyz_rotation: [0, 0, 0]
          supplier_link: 'https://www.digikey.com/en/products/detail/sullins-connector-solutions/PPTC121LFMS-RC/810154'
          manufacturer_part_number: 'PPTC121LFMS-RC'
          do_not_populate: 'DNP'
        adjust:
          rotate: 90
        where:
          ref: mirror_mcu

      pads_bat:
        what: ceoloide/battery_connector_jst_ph_2
        params:
          model_xyz_rotation: [-90,0,0]
          model_xyz_offset: [0,1.5,0]
          model_xyz_scale: [1, 1, 1]
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/JSTPH2-S2B-PH-K-LF-SN.step"
        where:
          ref: mirror_mcu
          shift: [mcu_x/2 +22, -10]
          rotate: 270
      reset:
        what: ceoloide/reset_switch_smd_side
        params:
          side: F #The same side that most switches height are, to avoid adding unnecessary height
          from: GND
          to: RST
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/EVQ-PUC02K.step"
          model_xyz_offset: [0, 0, 0]
          model_xyz_scale: [1, 1, 1]
          model_xyz_rotation: [180, 180, 0]
        adjust:
          rotate: 270
        where:
          ref: mirror_mcu
          shift: [mcu_x/2 +18 +2, -0]
      power:
        what: ceoloide/power_switch_smd_side
        params:
          side: F
          #          from: GND
          #          to: RST
          model_filename: "${PATH_TO_SWEEPYWAY_COMPONENT_MODELS}/SSSS811101--3DModel-STEP-269445.STEP"
          model_xyz_offset: [0, 0, 0]
          model_xyz_scale: [1, 1, 1]
          model_xyz_rotation: [90, 180, 90]
        adjust:
          rotate: 270
        where:
          ref: mirror_mcu
          shift: [mcu_x/2 +16, 8]
      url:
        what: ceoloide/utility_text
        params:
          text: *kb_url
          reversible: true
        adjust:
          shift: [0,-6]
        where: 
          - [/^mirror.*/, key, -1_5u, space]

      jlc:
        what: ceoloide/utility_text
        params:
          text: JLCJLCJLCJLC
          side: F
        adjust:
          shift: [0, 10]
        where: 
          - [/^mirror.*/, key, -1_5u, space]
      # version:
      #   what: ceoloide/utility_text
      #   params:
      #     text: *kb_version
      #   adjust:
      #     shift: [0,-6]
      #   where: 
      #     ref: mirror_mcu
      #     shift: [-mcu_y/2 -22,  -2]

      screws:
        what: ceoloide/mounting_hole_npth
        where: right_screw
        params:
          hole_size: screw_diameter
          hole_drill: screw_diameter

      # Standoff 3D previews - virtual footprints for 3D visualization
      # Positioned at standoff height above PCB
      r_standoffs:
        what: ceoloide/standoff-preview
        where: right_screw
        params:
          screw_diameter: m2
          length: standoff_length  # B17: single source of truth (was a literal 6)
          model_xyz_offset: [0,0,-10]
          model_xyz_rotation: [90,0,0]
          # model_filename auto-selected based on screw_diameter and length
          # model_xyz_offset auto-calculated (centers standoff vertically)
          do_not_populate: DNP

      # Top screws - hold the plate to the standoff
      r_screws_top:
        what: ceoloide/screw-preview-top
        where: right_screw
        params:
          screw_diameter: m2
          length: screw_top_length  # B21: derived minimum 5.9 mm; was 5
          head_type: low_socket  # Options: pan, low_socket, flat
          standoff_height: standoff_length  # must match the real standoff
          plate_thickness: top_plate_thickness
          do_not_populate: DNP

      # Bottom screws - hold the case to the standoff
      r_screws_bottom:
        what: ceoloide/screw-preview-bottom
        where: right_screw
        params:
          screw_diameter: m2
          length: screw_bottom_length  # B21: derived minimum 5.5 mm; was a literal 4 (preview could drift from the BOM)
          head_type: low_socket  # Options: pan, low_socket, flat
          case_bottom_thickness: case_bottom_thickness
          do_not_populate: DNP

cases:
  #We need to do something like this for the bottom plate:
  #left_plate_3d:
  #  - name: l_bottom_plate_outline #ref to extrude
  #    extrude: 1.2

  l_case_3d:
    - name: l_case_bottom #l_key_based_board_outline_with_extra_padding
      extrude: case_bottom_thickness
    - name: l_standoff_bosses
      extrude: standoff_boss_height
      shift: [0, 0, case_bottom_thickness]
    - name: l_case_border #l_case_border_outline
      extrude: case_border_height
    - name : l_usbc_border_outline
      extrude: usbc_slot_height # derived: floor -> wall top (11.2 under B20-D)
      shift: [-20,5,case_bottom_thickness]
      operation: subtract

  l_cover:
    - name: l_coverpart_switch_plate_outline #Create the switch plate
      extrude: top_plate_thickness
      shift: [0, 0, 25]
    - name: l_controller_area_to_cover_outline #create the controller housing
      extrude: controller_area_height
      shift: [0, 0, 25]
    - name: l_controler_area_to_not_fill #Make the controller housing hollow
      extrude: controller_area_height
      operation: subtract
      shift: [0, 0, 25]
    - name: l_controller_area_to_cover_outline #Add a roof to the controller housing
      extrude: controller_area_roof_z_thickness
      shift: [0, 0, 25+ controller_area_height]

  l_3d_preview:
    #Pasting all components here with vertical offsets we can verify that everything fits where it should
    - name: l_case_bottom #l_key_based_board_outline_with_extra_padding
      extrude: case_bottom_thickness
    - name: l_case_border #l_case_border_outline
      extrude: case_border_height
    - name : l_usbc_border_outline
      extrude: usbc_slot_height # derived: floor -> wall top (11.2 under B20-D)
      shift: [-20,5,case_bottom_thickness]
      operation: subtract
    - name: l_coverpart_switch_plate_outline
      extrude: 3
      shift: [0, 0, 25]

    #Components that shoulndt really be printed
    - name: l_pcb_outline
      shift: [0, 0, 20]

    #- name: l_hand_rest_polygon #This has an odd shape but i dont think we need to worry, it does not actually represent the polygon
    #  extrude: 3
    #  shift: [0, 0, 0]

    # - name: l_hand_rest_overlapping_polygon # test
    #   extrude: 3
    #   shift: [0,0, 30]

  ########################### B5: the right half's printed parts ###########################
  # Identical block structure to the left, but on the right-side outlines, so the two halves can
  # be compared part by part instead of trusting a slicer mirror. Two differences are deliberate
  # and are NOT mirror-able:
  #   * the USB-C slot cut is shifted [+20,5] (outboard on the RIGHT), because the slot has to
  #     open the controller bay's outer wall, which is on the other side of the mirror seam;
  #   * these parts follow the RIGHT PCB (r_pcb_outline), whose controller bay sits 3.0 mm closer
  #     to the mirror seam than the mirror of the left one (see docs/STATUS.md B5) - a mirrored
  #     left case would therefore be 3 mm off around the controller. Volume/bbox still match.

  r_case_3d:
    - name: r_case_bottom #r_key_based_board_outline_with_extra_padding
      extrude: case_bottom_thickness
    - name: r_standoff_bosses
      extrude: standoff_boss_height
      shift: [0, 0, case_bottom_thickness]
    - name: r_case_border #r_case_border_outline
      extrude: case_border_height
    - name : r_usbc_border_outline
      extrude: usbc_slot_height # derived: floor -> wall top (11.2 under B20-D)
      shift: [20,5,case_bottom_thickness]
      operation: subtract

  r_cover:
    - name: r_coverpart_switch_plate_outline #Create the switch plate
      extrude: top_plate_thickness
      shift: [0, 0, 25]
    - name: r_controller_area_to_cover_outline #create the controller housing
      extrude: controller_area_height
      shift: [0, 0, 25]
    - name: r_controler_area_to_not_fill #Make the controller housing hollow
      extrude: controller_area_height
      operation: subtract
      shift: [0, 0, 25]
    - name: r_controller_area_to_cover_outline #Add a roof to the controller housing
      extrude: controller_area_roof_z_thickness
      shift: [0, 0, 25+ controller_area_height]

  r_3d_preview:
    #Pasting all components here with vertical offsets we can verify that everything fits where it should
    - name: r_case_bottom #r_key_based_board_outline_with_extra_padding
      extrude: case_bottom_thickness
    - name: r_case_border #r_case_border_outline
      extrude: case_border_height
    - name : r_usbc_border_outline
      extrude: usbc_slot_height # derived: floor -> wall top (11.2 under B20-D)
      shift: [20,5,case_bottom_thickness]
      operation: subtract
    - name: r_coverpart_switch_plate_outline
      extrude: 3
      shift: [0, 0, 25]

    #Components that shoulndt really be printed
    - name: r_pcb_outline
      shift: [0, 0, 20]
